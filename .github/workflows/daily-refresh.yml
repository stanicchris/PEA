name: Daily Portfolio Refresh

on:
  schedule:
    # 17:45 Paris time is roughly 15:45 UTC (or 16:45 UTC depending on DST).
    - cron: '45 15 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Refresh Endpoint
        run: |
          curl -X POST https://pea-tpxq.onrender.com/api/cron/daily-refresh -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
