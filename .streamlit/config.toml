[theme]
primaryColor = "#2962FF"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1C1F26"
textColor = "#FFFFFF"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[client]
# Masque la barre d'outils supérieure et les raccourcis GitHub pour les visiteurs
toolbarMode = "minimal"
